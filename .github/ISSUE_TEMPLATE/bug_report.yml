name: Bug report
description: Something works incorrectly or unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including which tool was called and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: |
        The exact prompt or sequence of tool calls. If possible, include the model file
        (or a minimal one that reproduces the issue) and which Formlabs printer + material you used.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx -y formlabs-local-mcp doctor`
      description: Paste the whole thing. It shows the server version, PreFormServer version, mode and OS.
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code 2.x / Claude Desktop / Cursor / ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: PreFormServer stderr lines (the `[preform] …` ones from your MCP client) or any error from the tool call.
      render: text
