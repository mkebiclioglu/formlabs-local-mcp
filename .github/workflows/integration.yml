name: Integration (real PreFormServer)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, catches new PreFormServer releases

permissions:
  contents: read

jobs:
  install-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install PreFormServer (downloads from Formlabs, verifies signature)
        run: node dist/index.js install-preform
      - run: node dist/index.js doctor
      - name: Smoke test
        env:
          # Hosted Windows runners have no GPU; PreFormServer's renderer can die on save_screenshot there.
          SMOKE_ALLOW_SCREENSHOT_FAIL: ${{ runner.os == 'Windows' && '1' || '' }}
        run: npm run smoke

  wine:
    name: Linux via Wine (WineHQ devel, Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install WineHQ devel (PreFormServer 3.63.0 needs the ICU DLLs Wine added in 11.5), Xvfb and osslsigncode
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL https://dl.winehq.org/wine-builds/winehq.key -o /etc/apt/keyrings/winehq-archive.key
          sudo curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources -o /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends winehq-devel xvfb xauth osslsigncode libgl1-mesa-dri libegl1
          wine --version
      - name: Install PreFormServer (Windows build, Authenticode checked with osslsigncode)
        run: node dist/index.js install-preform
      - run: node dist/index.js doctor
      - name: Initialize the Wine prefix without the Mono/Gecko dialogs, and never park crashes in winedbg
        env:
          WINEDLLOVERRIDES: mscoree=d;mshtml=d
        run: |
          xvfb-run -a timeout 600 wineboot --init
          wine reg add 'HKLM\Software\Microsoft\Windows NT\CurrentVersion\AeDebug' /v Auto /t REG_DWORD /d 0 /f
          timeout 20 wineserver -w || { wineserver -k15; sleep 2; wineserver -k; } || true
      - name: Smoke test under Wine (paths are sent as Z:/...)
        env:
          PREFORM_LAUNCHER: xvfb-run -a wine
          PREFORM_STARTUP_TIMEOUT: "400"
          SMOKE_ALLOW_SCREENSHOT_FAIL: "1"
          WINEDEBUG: "-all,err+all"
        run: npm run smoke
