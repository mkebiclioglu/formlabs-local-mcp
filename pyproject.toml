[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formlabs-local-mcp"
version = "0.2.0"
description = "MCP server for the Formlabs Local API (PreFormServer): prep and print Formlabs jobs from Claude Code and other MCP clients"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mustafa Ebiclioglu" }]
keywords = ["mcp", "formlabs", "3d-printing", "preform", "claude", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
formlabs-local-mcp = "formlabs_local_mcp.server:main"

[project.urls]
Homepage = "https://mkebiclioglu.github.io/formlabs-claude-skills/"
Repository = "https://github.com/mkebiclioglu/formlabs-local-mcp"
Issues = "https://github.com/mkebiclioglu/formlabs-local-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/formlabs_local_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
